<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">23  联网状态终端</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">把数据获取与用户看到的状态分开处理。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">请求阶段</text><text x="62" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">Wi-Fi → DNS → TLS → HTTP</text><text x="62" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">每个阶段有超时</text><rect x="454" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">解析阶段</text><text x="472" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">限制正文与字段长度</text><text x="472" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">核对 JSON 类型和必要字段</text><rect x="44" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">显示阶段</text><text x="62" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">正常 / 旧数据 / 离线</text><text x="62" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">保留最后成功时间</text><rect x="454" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">验收阶段</text><text x="472" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">模拟 500、坏 JSON、断网</text><text x="472" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">不得卡死界面或显示假成功</text><text x="44" y="658" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">HTTPS 需要验证服务端；屏幕上的旧值必须有过期标记。</text></svg>