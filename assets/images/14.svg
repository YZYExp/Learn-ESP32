<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">14  Thread、Zigbee 与 Matter</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">协议所处层次不同，不能当作三个同义词。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="165" width="790" height="125" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="201" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">应用层：Matter</text><text x="62" y="237" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">约定设备能力、数据模型与交互；可以运行于多种 IP 网络</text><rect x="44" y="330" width="375" height="130" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="366" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">网络路线 A</text><text x="62" y="402" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">IP → Wi-Fi / Ethernet</text><rect x="459" y="330" width="375" height="130" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="477" y="366" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">网络路线 B</text><text x="477" y="402" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">IPv6 → Thread</text><rect x="459" y="500" width="375" height="130" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="477" y="536" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">IEEE 802.15.4</text><text x="477" y="572" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">Thread 的底层无线基础之一</text><rect x="44" y="500" width="375" height="130" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="536" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">Zigbee</text><text x="62" y="572" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">也可使用 802.15.4</text><text x="62" y="601" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">有自己的协议栈与应用体系</text><text x="44" y="685" fill="#087e83" font-size="22" font-family="Noto Sans CJK SC, sans-serif">Thread 设备到其他 IP 网络常需边界路由器。</text></svg>