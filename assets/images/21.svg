<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">21  环境记录器的四个阶段</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">采集、有效性、输出与验收分别建立。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">接线与发现</text><text x="62" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">3.3 V、GND、SDA8、SCL9</text><text x="62" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">检查 BME280 模块逻辑电压</text><rect x="454" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">读取与转换</text><text x="472" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">地址 0x76 / 0x77</text><text x="472" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">Pa ÷ 100 → hPa</text><rect x="44" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">形成记录</text><text x="62" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">seq、uptime、valid</text><text x="62" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">温度 / 湿度 / 气压</text><rect x="454" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">故障验收</text><text x="472" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">断开传感器不能伪造正常值</text><text x="472" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">按约定重试并记录错误</text><text x="44" y="658" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">基础项目以串口 CSV 为记录出口；它不自动获得断电保存。</text></svg>