<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">12  HTTP 与 MQTT</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">两种通信方式，确认语义仍要由应用定义。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="170" width="270" height="125" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="206" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">HTTP 客户端</text><text x="62" y="242" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">发出请求</text><rect x="565" y="170" width="270" height="125" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="583" y="206" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">HTTP 服务</text><text x="583" y="242" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">返回响应</text><path d="M315 205 L560 205" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M565 270 L320 270" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="295" y="420" width="290" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="313" y="456" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">MQTT Broker</text><text x="313" y="492" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">按主题转发消息</text><rect x="44" y="570" width="270" height="100" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="606" fill="#087e83" font-size="25