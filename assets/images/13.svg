<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">13  BLE 的数据关系</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">广播帮助发现；连接后的服务与特征表达数据接口。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">广播</text><text x="62" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">有限的发现信息</text><text x="62" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">不等于任意大文件传输</text><rect x="454" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">连接与角色</text><text x="472" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">Central 发起连接</text><text x="472" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">Peripheral 提供连接入口</text><rect x="44" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">GATT 服务与特征</text><text x="62" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">按 UUID 组织接口</text><text x="62" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">读取、写入、通知</text><rect x="454" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">权限与配对</text><text x="472" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">身份、加密与访问控制</text><text x="472" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">附近设备不天然可信</text><text x="44" y="658" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">S3 支持 BLE；经典蓝牙能力不能从旧 ESP32 教程推断。</text></svg>