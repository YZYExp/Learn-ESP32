<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">02  芯片、模组、开发板</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">名称层级不同，能够说明的信息也不同。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="155" width="790" height="470" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="191" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">开发板</text><text x="62" y="227" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">增加 USB、稳压、按键和排针</text><rect x="105" y="265" width="660" height="300" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="123" y="301" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">模组</text><text x="123" y="337" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">加入 Flash、射频外围与天线相关结构</text><rect x="165" y="380" width="525" height="140" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="183" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">SoC 芯片</text><text x="183" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">CPU、内部存储与硬件外设</text><text x="44" y="680" fill="#087e83" font-size="22" font-family="Noto Sans CJK SC, sans-serif">最终可用引脚与功能，必须核对具体板卡。</text></svg>