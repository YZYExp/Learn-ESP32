<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">05  从抖动到按下事件</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">稳定窗口是软件规则，数值需按开关和用途确定。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><text x="44" y="195" fill="#20384a" font-size="23" font-family="Noto Sans CJK SC, sans-serif">原始输入</text><text x="44" y="375" fill="#20384a" font-size="23" font-family="Noto Sans CJK SC, sans-serif">确认状态</text><polyline points="190,230 310,230 310,285 330,285 330,230 350,230 350,285 370,285 370,230 390,230 390,285 800,285" fill="none" stroke="#d88b31" stroke-width="4"/><polyline points="190,410 540,410 540,465 800,465" fill="none" stroke="#087e83" stroke-width="4"/><path d="M390 310 L540 310" stroke="#087e83" stroke-width="3" fill="none"/><text x="400" y="345" fill="#20384a" font-size="20" font-family="Noto Sans CJK SC, sans-serif">稳定 ≥ 30 ms</text><path d="M540 335 L540 510" stroke="#087e83" stroke-width="3" fill="none" stroke-dasharray="8 6"/><text x="555" y="545" fill="#20384a" font-size="22" font-family="Noto Sans CJK SC, sans-serif">仅此时产生一次事件</text><text x="44" y="645" fill="#087e83" font-size="23" font-family="Noto Sans CJK SC, sans-serif">长按期间保持状态，不在每轮循环重复切换。</text></svg>