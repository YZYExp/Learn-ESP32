<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">16  数据的时间与寿命</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">RAM、Flash 与网络各自有不同的持久性。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">工作 RAM</text><text x="62" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">断电一般丢失</text><text x="62" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">放当前状态与临时缓存</text><rect x="454" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">持久配置</text><text x="472" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">NVS 等非易失存储</text><text x="472" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">仅在参数实际变化时写</text><rect x="44" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">时间记录</text><text x="62" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">uptime 不等于日历时间</text><text x="62" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">对时前后的记录要区分</text><rect x="454" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">离线队列</text><text x="472" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">设置容量、溢出与重传规则</text><text x="472" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">序号帮助识别重复记录</text><text x="44" y="658" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">存储成功、发送成功和服务器确认是三件事。</text></svg>