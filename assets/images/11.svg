<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">11  连网故障逐层检查</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">上一层成功，不代表下一层已完成。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">无线链路</text><text x="62" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">是否扫描到目标 SSID</text><text x="62" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">频段与认证是否兼容</text><rect x="454" y="160" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="196" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">IP 网络</text><text x="472" y="232" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">是否获得有效地址</text><text x="472" y="261" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">网关、子网与路由</text><rect x="44" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">名称与连接</text><text x="62" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">DNS 是否解析成功</text><text x="62" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">TCP / TLS 是否建立</text><rect x="454" y="380" width="382" height="185" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="472" y="416" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">应用结果</text><text x="472" y="452" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">HTTP 状态与正文</text><text x="472" y="481" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">服务器是否确认持久化</text><text x="44" y="658" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">逐层收集证据，比重复重启更容易定位故障。</text></svg>