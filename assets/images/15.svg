<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">15  一份采样，两个独立接收方</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">普通队列取走消息后，其他消费者不会自动再收到同一条。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="270" y="150" width="340" height="125" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="288" y="186" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">采样任务</text><text x="288" y="222" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">先完成一份一致快照</text><rect x="44" y="370" width="350" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="406" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">显示队列</text><text x="62" y="442" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">可按策略仅保留最新值</text><rect x="485" y="370" width="350" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="503" y="406" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">上传队列</text><text x="503" y="442" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">有界容量与离线策略</text><path d="M360 280 L220 365" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M520 280 L660 365" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="44" y="555" width="350" height="100" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="591" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">显示任务</text><text x="62" y="627" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">只管理界面资源</text><rect x="485" y="555" width="350" height="100" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="503" y="591" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">上传任务</text><text x="503" y="627" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">网络等待不持屏幕锁</text><path d="M220 495 L220 550" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M660 495 L660 550" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="44" y="698" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">按值复制的快照减少共享状态；满队列行为须明确。</text></svg>