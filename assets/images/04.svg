<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">04  从代码到运行</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">每一阶段都要留下能观察的证据。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="125" y="155" width="630" height="133" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="143" y="191" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">01 编译</text><text x="143" y="227" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">源码 → 目标机器码</text><text x="143" y="256" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">证据：编译完成，无错误</text><path d="M440 290 L440 319" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="125" y="323" width="630" height="133" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="143" y="359" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">02 上传</text><text x="143" y="395" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">固件 → 目标板 Flash</text><text x="143" y="424" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">证据：写入与复位日志</text><path d="M440 458 L440 487" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="125" y="491" width="630" height="133" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="143" y="527" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">03 运行</text><text x="143" y="563" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">启动 → 持续执行程序</text><text x="143" y="592" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">证据：tick 递增、按键响应</text></svg>