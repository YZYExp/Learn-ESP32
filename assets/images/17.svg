<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">17  用时间预算计算功耗</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">下面是假设数据；实际要测整板、整周期。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><text x="44" y="170" fill="#20384a" font-size="26" font-family="Noto Sans CJK SC, sans-serif">一个 60 秒工作周期</text><rect x="44" y="210" width="165" height="90" rx="10" fill="#d88b31"/><text x="59" y="263" fill="#ffffff" font-size="25" font-family="Noto Sans CJK SC, sans-serif">活动 2 s</text><rect x="209" y="210" width="625" height="90" rx="10" fill="#087e83"/><text x="224" y="263" fill="#ffffff" font-size="25" font-family="Noto Sans CJK SC, sans-serif">睡眠 58 s</text><text x="44" y="345" fill="#587183" font-size="19" font-family="Noto Sans CJK SC, sans-serif">色块强调两种状态，不按持续时间严格成比例。</text><rect x="44" y="390" width="790" height="200" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="426" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">平均电流的教学计算</text><text x="62" y="462" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">活动：100 mA × 2 s；睡眠：0.1 mA × 58 s</text><text x="62" y="491" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">I平均 = (200 + 5.8) ÷ 60 ≈ 3.43 mA</text><text x="62" y="520" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">还需考虑稳压损耗、电池容量折减与唤醒重连</text><text x="44" y="670" fill="#087e83" font-size="22" font-family="Noto Sans CJK SC, sans-serif">芯片深睡参数不能直接当作开发板的电池电流。</text></svg>