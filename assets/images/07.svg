<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#087e83"/></marker></defs><rect width="880" height="780" fill="#f4f7f8"/><rect width="880" height="12" fill="#087e83"/><text x="44" y="65" fill="#20384a" font-size="31" font-family="Noto Sans CJK SC, sans-serif">07  UART、I2C 与 SPI 的连接</text><text x="44" y="105" fill="#587183" font-size="18" font-family="Noto Sans CJK SC, sans-serif">以下为信号关系示意，所有普通单端接口还需共同参考地。</text><text x="44" y="750" fill="#587183" font-size="16" font-family="Noto Sans CJK SC, sans-serif">ESP32 图解读本 · 原创教学示意，非实测数据 / 非实物尺寸</text><rect x="44" y="150" width="225" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="186" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">UART A</text><text x="62" y="222" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">TX / RX</text><rect x="610" y="150" width="225" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="628" y="186" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">UART B</text><text x="628" y="222" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">RX / TX</text><path d="M270 205 L605 205" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M610 245 L275 245" stroke="#087e83" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="44" y="315" width="225" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="351" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">I2C 主设备</text><text x="62" y="387" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">SDA / SCL</text><rect x="480" y="315" width="160" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="498" y="351" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">设备 A</text><text x="498" y="387" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">地址 A</text><rect x="675" y="315" width="160" height="120" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="693" y="351" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">设备 B</text><text x="693" y="387" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">地址 B</text><path d="M270 365 L780 365" stroke="#087e83" stroke-width="3" fill="none"/><path d="M270 405 L780 405" stroke="#087e83" stroke-width="3" fill="none"/><text x="290" y="345" fill="#20384a" font-size="18" font-family="Noto Sans CJK SC, sans-serif">SDA 与 SCL 共享；各自上拉到 3.3 V</text><rect x="44" y="495" width="225" height="150" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="62" y="531" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">SPI 主设备</text><text x="62" y="567" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">SCLK / MOSI / MISO</text><text x="62" y="596" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">各设备独立 CS</text><rect x="480" y="495" width="160" height="150" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="498" y="531" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">设备 A</text><text x="498" y="567" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">CS_A</text><rect x="675" y="495" width="160" height="150" rx="14" fill="white" stroke="#087e83" stroke-width="2"/><text x="693" y="531" fill="#087e83" font-size="25" font-family="Noto Sans CJK SC, sans-serif">设备 B</text><text x="693" y="567" fill="#20384a" font-size="19" font-family="Noto Sans CJK SC, sans-serif">CS_B</text><path d="M270 530 L780 530" stroke="#087e83" stroke-width="3" fill="none"/><path d="M270 575 L475 575" stroke="#087e83" stroke-width="3" fill="none"/><path d="M270 615 L670 615" stroke="#087e83" stroke-width="3" fill="none"/><text x="290" y="515" fill="#20384a" font-size="18" font-family="Noto Sans CJK SC, sans-serif">共享时钟 / 数据线</text><text x="44" y="693" fill="#087e83" font-size="21" font-family="Noto Sans CJK SC, sans-serif">图中仅说明拓扑；实际引脚方向与上拉值需按器件核对。</text></svg>